# Manual workflow: run the NLP pipeline against the production database.
# Settings → Secrets and variables → Actions → add DATABASE_URL (Neon URL with ?sslmode=require).
name: Run analysis pipeline
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "demo | google_play | db"
        default: demo
      market:
        description: "market slug (for db)"
        default: ""
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: services/pipeline } }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'none' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/cache@v4
        with: { path: services/pipeline/.cache, key: pipeline-models-v1 }
      - run: python -m pip install -r requirements.txt
      - run: python -m pipeline run --provider ${{ inputs.provider }} ${{ inputs.market && format('--market {0}', inputs.market) || '' }}
