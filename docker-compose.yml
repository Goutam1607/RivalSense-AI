# Local PostgreSQL for development. Used by `npm run db:up` when Docker is available.
services:
  postgres:
    image: postgres:18
    container_name: rivalsense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rivalsense
      POSTGRES_PASSWORD: rivalsense
      POSTGRES_DB: rivalsense
    ports:
      - "5432:5432"
    volumes:
      - rivalsense_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivalsense -d rivalsense"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  rivalsense_pgdata:
